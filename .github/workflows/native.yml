name: Build standalone engines
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'setup.sh', 'scripts/build-native.py', 'scripts/package-native.py', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements.lock . PyInstaller==6.16.0
      - name: Install test browser (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - run: python scripts/build-native.py
      - run: python -m unittest discover -s tests -v
        env:
          WEBSMITH_BROWSER_TEST: ${{ runner.os == 'Linux' && '1' || '' }}
          WEBSMITH_BROWSER_CHANNEL: chromium
          WEBSMITH_TEST_BINARY: ${{ github.workspace }}/dist/native/websmith${{ matrix.target == 'win32-x64' && '.exe' || '' }}
      - name: Verify bundled browser driver
        shell: bash
        run: ./dist/native/websmith${{ runner.os == 'Windows' && '.exe' || '' }} browser-install --check
      - run: python scripts/package-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/release/*
